<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layer 2: Control Technology Tests</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    /* Reset & Base (dark theme) */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary: #0f1117;
      --bg-secondary: #1a1d27;
      --bg-tertiary: #252833;
      --bg-card: #1e2130;
      --text-primary: #e8eaed;
      --text-secondary: #9aa0a6;
      --text-muted: #5f6368;
      --accent: #8ab4f8;
      --accent-hover: #aecbfa;
      --border: #2d3140;
      --success: #81c995;
      --warning: #fdd663;
      --error: #f28b82;
      --radius: 8px;
      --radius-lg: 12px;
      --shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Layout */
    .container { max-width: 1400px; margin: 0 auto; padding: 24px; }

    /* Header */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 0; border-bottom: 1px solid var(--border); margin-bottom: 24px;
    }
    .header h1 { font-size: 24px; font-weight: 600; }
    .header h1 span { color: var(--accent); }
    .header .stats { color: var(--text-secondary); font-size: 14px; }

    /* Model Selector */
    .model-selector {
      display: flex; gap: 8px; padding: 16px 0; margin-bottom: 8px;
    }
    .model-btn {
      padding: 10px 20px; border-radius: var(--radius); border: 2px solid var(--border);
      background: var(--bg-secondary); color: var(--text-secondary);
      cursor: pointer; font-size: 15px; font-weight: 600;
      transition: all 0.2s; display: flex; align-items: center; gap: 8px;
    }
    .model-btn:hover { border-color: var(--accent); color: var(--text-primary); }
    .model-btn.active {
      border-color: var(--accent); color: var(--text-primary);
      background: rgba(138,180,248,0.1);
    }
    .model-btn .dot {
      width: 10px; height: 10px; border-radius: 50%;
    }

    /* Tech Tabs */
    .tech-tabs {
      display: flex; gap: 8px; padding: 12px 0; overflow-x: auto;
      border-bottom: 1px solid var(--border); margin-bottom: 24px;
    }
    .tech-tab {
      padding: 8px 16px; border-radius: var(--radius); border: 1px solid var(--border);
      background: var(--bg-secondary); color: var(--text-secondary);
      cursor: pointer; font-size: 14px; font-weight: 500;
      white-space: nowrap; transition: all 0.2s;
    }
    .tech-tab:hover { border-color: var(--accent); color: var(--text-primary); }
    .tech-tab.active {
      background: var(--accent); color: var(--bg-primary);
      border-color: var(--accent); font-weight: 600;
    }
    .tech-tab .count {
      display: inline-block; background: rgba(255,255,255,0.15);
      padding: 1px 6px; border-radius: 10px; font-size: 11px; margin-left: 6px;
    }
    .tech-tab.active .count { background: rgba(0,0,0,0.2); }

    /* Test Group */
    .test-group {
      background: var(--bg-card); border-radius: var(--radius-lg);
      border: 1px solid var(--border); margin-bottom: 20px; overflow: hidden;
    }
    .test-group-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; cursor: pointer; user-select: none;
    }
    .test-group-header:hover { background: var(--bg-tertiary); }
    .test-group-header h3 { font-size: 16px; font-weight: 600; }
    .test-group-header .badge {
      font-size: 12px; padding: 2px 10px; border-radius: 12px;
      background: var(--bg-tertiary); color: var(--text-secondary);
    }
    .test-group-header .toggle-icon {
      color: var(--text-muted); transition: transform 0.2s;
    }
    .test-group-header .toggle-icon.open { transform: rotate(180deg); }

    .test-group-body { padding: 0 20px 20px; }

    .assessment {
      background: var(--bg-secondary); border-radius: var(--radius);
      padding: 12px 16px; margin-bottom: 16px; border-left: 3px solid var(--accent);
      font-size: 14px; color: var(--text-secondary); line-height: 1.7;
    }
    .assessment strong { color: var(--text-primary); }

    .params {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;
    }
    .param-tag {
      font-family: 'JetBrains Mono', monospace; font-size: 12px;
      padding: 3px 8px; border-radius: 4px;
      background: var(--bg-tertiary); color: var(--text-secondary);
    }

    /* Image Grid */
    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    .image-grid.strip {
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    }
    .image-grid.matrix {
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    }

    .image-card {
      position: relative; border-radius: var(--radius);
      overflow: hidden; cursor: pointer; background: var(--bg-secondary);
      border: 1px solid var(--border); transition: border-color 0.2s, transform 0.2s;
    }
    .image-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .image-card img {
      width: 100%; height: auto; display: block; aspect-ratio: 2/3;
      object-fit: cover;
    }
    .image-card .label {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 6px 10px; background: linear-gradient(transparent, rgba(0,0,0,0.8));
      font-size: 11px; color: rgba(255,255,255,0.9);
    }

    /* Before/After Layout */
    .before-after-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    }
    .ba-pair {
      display: flex; gap: 4px; background: var(--bg-secondary);
      border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border);
    }
    .ba-pair .ba-side { flex: 1; position: relative; }
    .ba-pair .ba-side img { width: 100%; height: auto; display: block; }
    .ba-pair .ba-label {
      position: absolute; top: 8px; left: 8px;
      font-size: 11px; font-weight: 600; padding: 2px 8px;
      border-radius: 4px; background: rgba(0,0,0,0.6);
    }
    .ba-pair .ba-label.before { color: var(--warning); }
    .ba-pair .ba-label.after { color: var(--success); }

    /* Lightbox */
    .lightbox {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.92); z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      padding: 40px;
    }
    .lightbox img {
      max-width: 90vw; max-height: 85vh; object-fit: contain;
      border-radius: var(--radius);
    }
    .lightbox-close {
      position: absolute; top: 20px; right: 20px;
      background: none; border: none; color: white;
      font-size: 32px; cursor: pointer; opacity: 0.7;
    }
    .lightbox-close:hover { opacity: 1; }
    .lightbox-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.1); border: none; color: white;
      font-size: 24px; padding: 12px; border-radius: 50%; cursor: pointer;
    }
    .lightbox-nav:hover { background: rgba(255,255,255,0.2); }
    .lightbox-nav.prev { left: 20px; }
    .lightbox-nav.next { right: 20px; }
    .lightbox-info {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: var(--radius);
      font-size: 13px; color: var(--text-secondary);
    }

    /* Loading */
    .loading-spinner {
      display: flex; align-items: center; justify-content: center;
      padding: 60px; color: var(--text-muted);
    }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Empty state */
    .empty-state {
      text-align: center; padding: 60px 20px; color: var(--text-muted);
    }
    .empty-state .material-icons-round { font-size: 48px; margin-bottom: 12px; }

    /* Responsive */
    @media (max-width: 768px) {
      .container { padding: 16px; }
      .image-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      .before-after-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div x-data="layer2App" x-init="init()" class="container">
    <!-- Header -->
    <div class="header">
      <div>
        <h1><span>Layer 2</span>: Control Technology Tests</h1>
      </div>
      <div class="stats" x-show="index">
        <span x-text="modelLabel"></span> |
        <span x-text="totalImages + ' images'"></span> |
        <span x-text="Object.keys(index?.test_groups || {}).length + ' technologies'"></span>
      </div>
    </div>

    <!-- Model Selector -->
    <div class="model-selector">
      <template x-for="model in models" :key="model.key">
        <button class="model-btn" :class="{'active': activeModel === model.key}"
                @click="switchModel(model.key)">
          <span class="dot" :style="'background:' + model.color"></span>
          <span x-text="model.label"></span>
        </button>
      </template>
    </div>

    <!-- Tech Tabs -->
    <div class="tech-tabs" x-show="index">
      <button class="tech-tab" :class="{'active': activeTech === 'all'}" @click="activeTech = 'all'">
        All
        <span class="count" x-text="totalImages"></span>
      </button>
      <template x-for="(group, key) in (index?.test_groups || {})" :key="key">
        <button class="tech-tab" :class="{'active': activeTech === key}" @click="activeTech = key">
          <span x-text="group.name"></span>
          <span class="count" x-text="techImageCount(key)"></span>
        </button>
      </template>
    </div>

    <!-- Loading -->
    <div class="loading-spinner" x-show="loading">
      <span class="material-icons-round spin" style="font-size:36px">autorenew</span>
      <span style="margin-left:12px">Loading test results...</span>
    </div>

    <!-- Empty State -->
    <div class="empty-state" x-show="!loading && !index">
      <span class="material-icons-round">science</span>
      <p>No test results found.</p>
      <p style="font-size:13px;margin-top:8px">Run Layer 2 tests first:<br>
        <code style="color:var(--accent)">./scripts/start-batch-eval.sh --layer2</code>
      </p>
    </div>

    <!-- Test Groups -->
    <template x-for="(group, techKey) in filteredGroups()" :key="techKey">
      <div>
        <h2 style="margin:24px 0 16px;font-size:20px;color:var(--accent)" x-text="group.name"></h2>
        <p style="color:var(--text-secondary);margin-bottom:16px;font-size:14px" x-text="group.description"></p>

        <template x-for="test in group.tests" :key="test.id">
          <div class="test-group">
            <div class="test-group-header" @click="toggleGroup(techKey + '_' + test.id)">
              <div style="display:flex;align-items:center;gap:12px">
                <h3 x-text="test.name"></h3>
                <span class="badge" x-text="test.image_count + ' images'"></span>
              </div>
              <span class="material-icons-round toggle-icon"
                    :class="{'open': isGroupOpen(techKey + '_' + test.id)}">
                expand_more
              </span>
            </div>

            <div class="test-group-body" x-show="isGroupOpen(techKey + '_' + test.id)" x-transition.duration.200ms>
              <!-- Assessment -->
              <div class="assessment" x-show="getTestMeta(techKey, test.id)?.layer2?.assessment">
                <div x-html="getTestMeta(techKey, test.id)?.layer2?.assessment || ''"></div>
              </div>

              <!-- Parameters -->
              <div class="params" x-show="getTestMeta(techKey, test.id)?.layer2?.parameters">
                <template x-for="(val, key) in (getTestMeta(techKey, test.id)?.layer2?.parameters || {})" :key="key">
                  <span class="param-tag" x-text="key + '=' + JSON.stringify(val)"></span>
                </template>
              </div>

              <!-- Images: choose layout based on display_layout -->
              <template x-if="getLayout(techKey, test.id) === 'before_after'">
                <div class="before-after-grid">
                  <template x-for="(pair, idx) in getBeforeAfterPairs(techKey, test.id)" :key="idx">
                    <div class="ba-pair">
                      <div class="ba-side">
                        <img :src="getThumbUrl(techKey, test.id, pair.before)"
                             @click="openLightbox(techKey, test.id, pair.beforeIdx)"
                             loading="lazy">
                        <span class="ba-label before">Before</span>
                      </div>
                      <div class="ba-side">
                        <img :src="getThumbUrl(techKey, test.id, pair.after)"
                             @click="openLightbox(techKey, test.id, pair.afterIdx)"
                             loading="lazy">
                        <span class="ba-label after">After</span>
                      </div>
                    </div>
                  </template>
                </div>
              </template>

              <template x-if="getLayout(techKey, test.id) !== 'before_after'">
                <div class="image-grid" :class="getLayout(techKey, test.id)">
                  <template x-for="(img, idx) in getTestImages(techKey, test.id)" :key="img">
                    <div class="image-card" @click="openLightbox(techKey, test.id, idx)">
                      <img :src="getThumbUrl(techKey, test.id, img)" loading="lazy"
                           :alt="getImageLabel(techKey, test.id, img)">
                      <div class="label" x-text="getImageLabel(techKey, test.id, img)"></div>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- Lightbox -->
    <div class="lightbox" x-show="lightbox.open" @keydown.escape.window="lightbox.open = false"
         @click.self="lightbox.open = false" x-transition>
      <button class="lightbox-close" @click="lightbox.open = false">
        <span class="material-icons-round">close</span>
      </button>
      <button class="lightbox-nav prev" @click="lightboxPrev()" x-show="lightbox.idx > 0">
        <span class="material-icons-round">chevron_left</span>
      </button>
      <img :src="lightbox.src" :alt="lightbox.label">
      <button class="lightbox-nav next" @click="lightboxNext()"
              x-show="lightbox.idx < lightbox.images.length - 1">
        <span class="material-icons-round">chevron_right</span>
      </button>
      <div class="lightbox-info" x-show="lightbox.label">
        <span x-text="lightbox.label"></span>
        <span style="margin-left:12px;color:var(--text-muted)"
              x-text="(lightbox.idx + 1) + ' / ' + lightbox.images.length"></span>
      </div>
    </div>
  </div>

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="js/layer2.js"></script>
</body>
</html>
