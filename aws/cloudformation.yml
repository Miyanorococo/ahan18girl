AWSTemplateFormatVersion: '2010-09-09'
Description: r18_anime - AI Content Generation Infrastructure (us-east-1)

Parameters:
  S3BucketName:
    Type: String
    Default: r18-anime-assets
    Description: S3 bucket name for models, outputs, and logs

  EBSVolumeSize:
    Type: Number
    Default: 200
    Description: EBS volume size in GB

  AvailabilityZone:
    Type: String
    Default: us-east-1c
    AllowedValues:
      - us-east-1c
      - us-east-1d
    Description: Preferred AZ for stable Spot pricing

Conditions:
  AZisC: !Equals [!Ref AvailabilityZone, 'us-east-1c']

Resources:
  # ============================================================
  # VPC & Networking
  # ============================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: r18-anime-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: r18-anime-igw

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # --- Public Subnet (ALB, NAT Gateway) ---
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Ref AvailabilityZone
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: r18-anime-public-subnet

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: r18-anime-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # --- Second Public Subnet (required: ALB needs 2 AZs) ---
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !If
        - AZisC
        - us-east-1d
        - us-east-1c
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: r18-anime-public-subnet-2

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # --- Private Subnet (EC2) ---
  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Ref AvailabilityZone
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: r18-anime-private-subnet

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: r18-anime-private-rt

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NATGateway

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  # --- NAT Gateway ---
  NATGatewayEIP:
    Type: AWS::EC2::EIP
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: r18-anime-nat-eip

  NATGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NATGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: r18-anime-nat-gw

  # ============================================================
  # Security Groups
  # ============================================================

  # ALB Security Group: allows inbound from CloudFront only
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB - allow inbound from CloudFront managed prefix list
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: pl-3b927c52
          Description: HTTP from CloudFront (com.amazonaws.global.cloudfront.origin-facing)
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound
      Tags:
        - Key: Name
          Value: r18-anime-alb-sg

  # EC2 Security Group: allows inbound from ALB on 8188 and from SSM endpoints on 443
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EC2 - ComfyUI from ALB, HTTPS for SSM endpoints
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound
      Tags:
        - Key: Name
          Value: r18-anime-ec2-sg

  EC2SecurityGroupIngressFromALB:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 8188
      ToPort: 8188
      SourceSecurityGroupId: !Ref ALBSecurityGroup
      Description: ComfyUI from ALB

  EC2SecurityGroupIngressFromSSMEndpoints:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref SSMEndpointSecurityGroup
      Description: HTTPS from SSM VPC endpoints

  # SSM Endpoint Security Group: allows inbound from EC2 on 443
  SSMEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SSM VPC Endpoints - HTTPS from EC2
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref EC2SecurityGroup
          Description: HTTPS from EC2 instances
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound
      Tags:
        - Key: Name
          Value: r18-anime-ssm-endpoint-sg

  # ============================================================
  # VPC Endpoints for SSM (Session Manager)
  # ============================================================
  SSMEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssm'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref SSMEndpointSecurityGroup

  SSMMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssmmessages'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref SSMEndpointSecurityGroup

  EC2MessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ec2messages'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref SSMEndpointSecurityGroup

  # ============================================================
  # IAM Role + Instance Profile
  # ============================================================
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: r18-anime-ec2-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:DeleteObject
                Resource:
                  - !Sub 'arn:aws:s3:::${S3BucketName}'
                  - !Sub 'arn:aws:s3:::${S3BucketName}/*'
                  - 'arn:aws:s3:::illust-novel-ah18'
                  - 'arn:aws:s3:::illust-novel-ah18/*'
        - PolicyName: EC2SpotAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeSpotInstanceRequests
                  - ec2:DescribeVolumes
                  - ec2:AttachVolume
                  - ec2:DetachVolume
                Resource: '*'
      Tags:
        - Key: Name
          Value: r18-anime-ec2-role

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: r18-anime-instance-profile
      Roles:
        - !Ref EC2Role

  # ============================================================
  # S3 Bucket
  # ============================================================
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref S3BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      IntelligentTieringConfigurations:
        - Id: default-tiering
          Status: Enabled
          Tierings:
            - AccessTier: ARCHIVE_ACCESS
              Days: 90
            - AccessTier: DEEP_ARCHIVE_ACCESS
              Days: 180
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Name
          Value: r18-anime-bucket

  # ============================================================
  # EBS Volume
  # ============================================================
  EBSVolume:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: !Ref AvailabilityZone
      Size: !Ref EBSVolumeSize
      VolumeType: gp3
      Encrypted: true
      Iops: 3000
      Throughput: 125
      Tags:
        - Key: Name
          Value: r18-anime-ebs

  # ============================================================
  # Launch Template
  # ============================================================
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: r18-anime-gpu
      VersionDescription: Latest with NVMe EBS auto-detect
      LaunchTemplateData:
        # Deep Learning OSS Nvidia Driver AMI GPU PyTorch 2.7 (Ubuntu 22.04) - us-east-1 x86_64
        # Update this AMI ID to the latest version before first deploy
        ImageId: ami-07696cdd1f2a506ed
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        NetworkInterfaces:
          - DeviceIndex: 0
            SubnetId: !Ref PrivateSubnet
            AssociatePublicIpAddress: false
            Groups:
              - !Ref EC2SecurityGroup
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs:
              VolumeSize: 100
              VolumeType: gp3
              Encrypted: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: r18-anime-gpu
              - Key: Project
                Value: r18_anime
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -e

            # Wait for DLAMI background apt-get to finish (holds lock on boot)
            for i in $(seq 1 30); do
              if fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; then
                echo "Waiting for apt lock to release... ($i/30)"
                sleep 10
              else
                break
              fi
            done
            apt-get update -qq && apt-get install -y python3-venv -qq

            # Attach the persistent EBS volume
            TOKEN=$(curl -sX PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds:300")
            INSTANCE_ID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
            aws ec2 attach-volume \
              --volume-id ${EBSVolume} \
              --instance-id $INSTANCE_ID \
              --device /dev/xvdf \
              --region us-east-1 || true

            # Identify EBS device by volume serial number (strips "vol-" prefix and dashes)
            # EBS NVMe serial = volume ID without dashes, e.g. vol-0abc -> vol0abc
            EXPECTED_SERIAL=$(echo "${EBSVolume}" | tr -d '-')
            EBS_DEV=""
            for attempt in $(seq 1 12); do
              for dev in /dev/nvme*n1; do
                [ -b "$dev" ] || continue
                SERIAL=$(lsblk -dn -o SERIAL "$dev" 2>/dev/null || true)
                if [ "$SERIAL" = "$EXPECTED_SERIAL" ]; then
                  EBS_DEV="$dev"
                  break 2
                fi
              done
              echo "Waiting for EBS to appear... ($attempt/12)"
              sleep 5
            done

            if [ -z "$EBS_DEV" ]; then
              echo "WARNING: EBS volume ${EBSVolume} not found by serial"
              exit 0
            fi
            echo "Found EBS ${EBSVolume} at $EBS_DEV"

            # Mount EBS (create ext4 filesystem if blank)
            mkdir -p /data
            FSTYPE=$(blkid -o value -s TYPE "$EBS_DEV" 2>/dev/null || true)
            if [ -z "$FSTYPE" ]; then
              mkfs.ext4 "$EBS_DEV"
            elif [ "$FSTYPE" != "ext4" ]; then
              echo "ERROR: $EBS_DEV has unexpected filesystem: $FSTYPE"
              exit 1
            fi
            mount "$EBS_DEV" /data
            # Use UUID in fstab (NVMe device names change across reboots)
            EBS_UUID=$(blkid -s UUID -o value "$EBS_DEV")
            sed -i '\|/data|d' /etc/fstab
            echo "UUID=$EBS_UUID /data ext4 defaults,nofail 0 2" >> /etc/fstab
            chown -R ubuntu:ubuntu /data

            # Save config for setup.sh
            echo "EBS_VOLUME_ID=${EBSVolume}" > /data/.env
            echo "S3_BUCKET=${S3BucketName}" >> /data/.env
            echo "AWS_REGION=us-east-1" >> /data/.env

            # Rebuild NVIDIA DKMS for current kernel if needed
            if ! modprobe nvidia 2>/dev/null; then
              echo "NVIDIA driver not loaded, rebuilding DKMS..."
              apt-get install -y linux-headers-$(uname -r) -qq
              dkms install nvidia/580.126.09 -k $(uname -r) || true
              modprobe nvidia || echo "WARNING: NVIDIA driver still not loaded"
            fi

            # Run full setup (ComfyUI install, systemd service, custom nodes)
            if [ -f /data/ComfyUI/venv/bin/python ]; then
              # Existing installation: just configure systemd and start
              echo "Existing ComfyUI found, configuring service..."
            fi
            # Download and run setup.sh from S3 or use inline minimal setup
            # For now, setup.sh is expected to be on EBS from first run
            if [ -x /data/setup.sh ]; then
              /data/setup.sh
            else
              # Minimal inline: create systemd service and start
              cat > /etc/systemd/system/comfyui.service << 'SVC'
            [Unit]
            Description=ComfyUI
            After=network.target
            [Service]
            Type=simple
            User=ubuntu
            Group=ubuntu
            WorkingDirectory=/data/ComfyUI
            ExecStart=/data/ComfyUI/venv/bin/python /data/ComfyUI/main.py --listen 0.0.0.0 --port 8188 --highvram
            Restart=on-failure
            RestartSec=10
            StandardOutput=journal
            StandardError=journal
            LimitNOFILE=65536
            [Install]
            WantedBy=multi-user.target
            SVC
              systemctl daemon-reload
              systemctl enable comfyui
              systemctl start comfyui
            fi

  # ============================================================
  # Application Load Balancer
  # ============================================================
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: VPCGatewayAttachment
    Properties:
      Name: r18-anime-alb
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: r18-anime-alb

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: r18-anime-comfyui-tg
      Protocol: HTTP
      Port: 8188
      VpcId: !Ref VPC
      TargetType: instance
      HealthCheckProtocol: HTTP
      HealthCheckPort: '8188'
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: '200'
      # Enable stickiness for WebSocket connections
      TargetGroupAttributes:
        - Key: stickiness.enabled
          Value: 'true'
        - Key: stickiness.type
          Value: lb_cookie
        - Key: stickiness.lb_cookie.duration_seconds
          Value: '86400'
      Tags:
        - Key: Name
          Value: r18-anime-comfyui-tg

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

Outputs:
  VPCId:
    Value: !Ref VPC
    Export:
      Name: r18-anime-vpc-id

  PublicSubnetId:
    Value: !Ref PublicSubnet
    Export:
      Name: r18-anime-public-subnet-id

  PrivateSubnetId:
    Value: !Ref PrivateSubnet
    Export:
      Name: r18-anime-private-subnet-id

  SecurityGroupId:
    Value: !Ref EC2SecurityGroup
    Export:
      Name: r18-anime-sg-id

  InstanceProfileArn:
    Value: !GetAtt InstanceProfile.Arn
    Export:
      Name: r18-anime-instance-profile-arn

  LaunchTemplateId:
    Value: !Ref LaunchTemplate
    Export:
      Name: r18-anime-launch-template-id

  EBSVolumeId:
    Value: !Ref EBSVolume
    Export:
      Name: r18-anime-ebs-volume-id

  S3BucketName:
    Value: !Ref S3Bucket
    Export:
      Name: r18-anime-s3-bucket

  ALBDnsName:
    Value: !GetAtt ALB.DNSName
    Export:
      Name: r18-anime-alb-dns

  TargetGroupArn:
    Value: !Ref TargetGroup
    Export:
      Name: r18-anime-target-group-arn
